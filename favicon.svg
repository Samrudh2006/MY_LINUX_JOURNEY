<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Metallic Blue Shield Gradient -->
    <linearGradient id="shieldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Neon Green Laser Gradient -->
    <linearGradient id="laserGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Outer Hexagon Shield Container -->
  <polygon points="256,16 460,110 460,402 256,496 52,402 52,110" fill="url(#bgGlow)" stroke="url(#shieldMetal)" stroke-width="16" />

  <!-- Inner Cyber Tech Circuit Ring -->
  <polygon points="256,40 436,124 436,388 256,472 76,388 76,124" fill="none" stroke="#1e293b" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Main SOC Analyst Shield -->
  <path d="M256 70 L390 120 V250 C390 350 320 430 256 455 C192 430 122 350 122 250 V120 Z" fill="#090d16" stroke="url(#shieldMetal)" stroke-width="14" />

  <!-- Inner Shield Glow Rim -->
  <path d="M256 95 L365 135 V245 C365 325 310 395 256 418 C202 395 147 325 147 245 V135 Z" fill="none" stroke="url(#goldAccent)" stroke-width="4" opacity="0.8" />

  <!-- Terminal Prompt Chevron '>' -->
  <path d="M175 190 L245 256 L175 322" fill="none" stroke="url(#laserGreen)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Terminal Cursor '_' -->
  <line x1="265" y1="322" x2="335" y2="322" stroke="url(#laserGreen)" stroke-width="32" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Top Crown Cyber Stars -->
  <circle cx="256" cy="115" r="12" fill="url(#goldAccent)" />
  <circle cx="206" cy="125" r="8" fill="#38bdf8" />
  <circle cx="306" cy="125" r="8" fill="#38bdf8" />
</svg>
